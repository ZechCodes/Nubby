name: Build and deploy documentation
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"
      - run: uv install --extras docs
      - name: Build and deploy docs
        run: uv run mkdocs gh-deploy --force
