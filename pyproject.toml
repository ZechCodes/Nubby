[project]
name = "nubby"
version = "0.1.2"
description = "A simple config loader for Python using Bevy for dependency injection."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Zech Zimmerman", email = "hi@zech.codes"}
]
dependencies = [
    "bevy==3.0.0b2",
    "tramp>=2025.3.2",
]

[project.optional-dependencies]
yaml = [
    "pyyaml>=6.0.2",
]
toml = [
    "tomlkit>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.15",
    "mkdocstrings>=0.24.1",
    "mkdocstrings-python>=1.9.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.1",
    "mkdocs-section-index>=0.3.8",
    "mkdocs-autorefs>=0.5.0",
    "ruff>=0.11.2",
]
