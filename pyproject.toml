[project]
name = "nubby"
version = "0.1.1"
description = "A simple config loader for Python using Bevy for dependency injection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bevy==3.0.0b2",
    "tramp>=0.1.17",
]

[project.optional-dependencies]
yaml = [
    "pyyaml>=6.0.2",
]
toml = [
    "tomlkit>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
